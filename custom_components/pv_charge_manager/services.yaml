recalculate:
  name: Recalculate charge plan
  description: Recalculate the PV charge plan from the latest available states.
  fields: {}

start_boost:
  name: Start boost charging
  description: Reserved for a future manually requested boost mode; automatic wallbox control is handled by the configured safety controller.
  fields:
    duration_minutes:
      name: Duration
      description: Requested boost duration in minutes.
      required: false
      selector:
        number:
          min: 5
          max: 240
          unit_of_measurement: min
