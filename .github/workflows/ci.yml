name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Validate Home Assistant app repository
        run: |
          bash -n apps/pv_charge_manager_installer/run.sh
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in (Path("repository.yaml"), Path("apps/pv_charge_manager_installer/config.yaml")):
              assert isinstance(yaml.safe_load(path.read_text()), dict), path
          for path in Path(".").glob("**/*.json"):
              json.loads(path.read_text())
          PY
